name: Bug report
description: Report a reproducible Philip Relay problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: host
    attributes:
      label: Host
      options: ["Claude Code", "Codex", "Both", "Other"]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Philip Relay version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and actual result
      description: Remove tokens, private paths, repositories, and project memory.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
